<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1877F2"/>
<title>ديون زروقي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#1877F2;--blue2:#166FE5;--blue3:#E7F3FF;--blue4:#0a4fa0;
  --green:#42b72a;--red:#fa3e3e;--gold:#f7c948;
  --bg:#f0f2f5;--card:#fff;--border:#dde1e7;
  --txt:#050505;--sub:#65676b;--mut:#8a8d91;
  --hdr:#fff;--nav:#fff;--inp:#f0f2f5;
  --shadow:0 1px 3px rgba(0,0,0,0.12);
}
.dark{
  --bg:#18191a;--card:#242526;--border:#3a3b3c;
  --txt:#e4e6eb;--sub:#b0b3b8;--mut:#6a6b6c;
  --hdr:#242526;--nav:#242526;--inp:#3a3b3c;
  --blue3:rgba(24,119,242,0.15);
  --shadow:0 1px 3px rgba(0,0,0,0.35);
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-thumb{background:var(--blue);border-radius:2px;}
.hov:active{opacity:0.85;transform:scale(0.98);}
.bs{transition:transform 0.15s;} .bs:active{transform:scale(0.95);}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}} .fu{animation:fu 0.28s ease forwards;}
@keyframes sd{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}} .sd{animation:sd 0.28s cubic-bezier(.2,.8,.4,1) forwards;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}} .pulse{animation:pulse 2s infinite;}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.prog{height:8px;border-radius:999px;overflow:hidden;background:var(--border);}
.pfill{height:100%;border-radius:999px;transition:width 1.1s cubic-bezier(.4,0,.2,1);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:500px;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;padding:20px 16px 34px;background:var(--card);}
.pill{padding:6px 14px;border-radius:999px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:11px;transition:all 0.18s;white-space:nowrap;}
input,select{-webkit-appearance:none;appearance:none;font-family:'Cairo',sans-serif;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);}
select option{background:var(--card);color:var(--txt);}
.cbtn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;transition:transform 0.15s;width:100%;margin-bottom:10px;color:#fff;}
.cbtn:active{transform:scale(0.97);}
.fb-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px;border:1px solid var(--border);}
</style>
</head>
<body>
<div id="app"></div>

<script>
const VER="2.1.0";
const SK="zerrouki-v5";
const PHONE="+213776728421";

const ld=()=>{try{return JSON.parse(localStorage.getItem(SK)||"{}");}catch{return{};}};
const sv=d=>{try{localStorage.setItem(SK,JSON.stringify(d));}catch{}};

const MAR=["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const MFR=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const T={
  ar:{app:"ديون زروقي",sub:"مدير الديون الذكي",ver:"الإصدار",
    dash:"الرئيسية",debts:"الديون",exp:"المصاريف",hist:"السجل",cnt:"تواصل",
    totDebt:"إجمالي الديون",totPaid:"تم الدفع",rem:"المتبقي",paid:"مدفوع",
    addPay:"تسجيل دفعة",newExp:"مصروف جديد",amt:"المبلغ",month:"الشهر",
    year:"السنة",note:"ملاحظة",notePh:"مثال: دفعة شهر جانفي",
    okPay:"✅ تأكيد الدفعة",okExp:"✅ تأكيد المصروف",
    payHist:"سجل الدفعات",fullHist:"السجل الكامل",
    noPays:"لا توجد دفعات بعد",noExps:"لا توجد مصاريف",
    todayExp:"مصاريف اليوم",thisMonth:"هذا الشهر",
    active:"نشط الآن",wait:"في الانتظار",done:"مكتمل",
    monthsLeft:"شهر متبقي",origAmt:"المبلغ الأصلي",pays:"دفعة",
    contDesc:"تواصل عبر:",call:"اتصال مباشر",
    food:"مواد غذائية",veggie:"خضر وفواكه",clothes:"ملابس",other:"أخرى",
    typ:"النوع",dat:"التاريخ",dark:"الوضع الليلي",light:"الوضع النهاري",
    cur:"العملة",lang:"اللغة",
    amtErr:"أدخل مبلغاً صحيحاً",overErr:"المبلغ أكبر من المتبقي!",
    okSave:"✅ تم تسجيل الدفعة",okExp2:"✅ تم تسجيل المصروف",
    next:"انتهيت! بدأ دور",set:"الإعدادات",
    notifEn:"تفعيل التنبيهات",notifOn:"✅ تنبيهات مفعّلة",
    lastPay:"آخر دفعة",search:"بحث...",del:"حذف",
  },
  fr:{app:"Dettes Zerrouki",sub:"Gestionnaire intelligent",ver:"Version",
    dash:"Accueil",debts:"Dettes",exp:"Dépenses",hist:"Historique",cnt:"Contact",
    totDebt:"Total dettes",totPaid:"Payé",rem:"Restant",paid:"Payé",
    addPay:"Enregistrer paiement",newExp:"Nouvelle dépense",amt:"Montant",month:"Mois",
    year:"Année",note:"Note",notePh:"Ex: paiement janvier",
    okPay:"✅ Confirmer paiement",okExp:"✅ Confirmer dépense",
    payHist:"Historique",fullHist:"Historique complet",
    noPays:"Aucun paiement",noExps:"Aucune dépense",
    todayExp:"Dépenses aujourd'hui",thisMonth:"Ce mois",
    active:"Actif",wait:"En attente",done:"Terminé",
    monthsLeft:"mois restants",origAmt:"Montant initial",pays:"paiement",
    contDesc:"Contacter via:",call:"Appeler",
    food:"Alimentation",veggie:"Légumes & fruits",clothes:"Vêtements",other:"Autre",
    typ:"Type",dat:"Date",dark:"Mode sombre",light:"Mode clair",
    cur:"Devise",lang:"Langue",
    amtErr:"Entrez un montant valide",overErr:"Montant trop élevé!",
    okSave:"✅ Paiement enregistré",okExp2:"✅ Dépense enregistrée",
    next:"Terminé! Au tour de",set:"Paramètres",
    notifEn:"Activer notifications",notifOn:"✅ Notifications activées",
    lastPay:"Dernier paiement",search:"Rechercher...",del:"Supprimer",
  }
};

const D0=[
  {id:"faqir",name:"فقير محمد",nameFr:"Faquir Mohamed",icon:"👨",total:35000000,monthly:1000000,color:"#1877F2",active:true,order:1},
  {id:"moussaoui",name:"موساوي فاطمة",nameFr:"Moussaoui Fatima",icon:"👩",total:26000000,monthly:1000000,color:"#42b72a",active:false,order:2},
  {id:"sabria",name:"زروقي صابرية",nameFr:"Zerrouki Sabria",icon:"👩‍🦱",total:5000000,monthly:1000000,color:"#f7c948",active:false,order:3},
  {id:"tawfiq",name:"زروقي توفيق",nameFr:"Zerrouki Tawfiq",icon:"👨‍🦰",total:5000000,monthly:1000000,color:"#fa3e3e",active:false,order:4},
];
const CATS=[
  {id:"food",icon:"🛒",color:"#1877F2"},
  {id:"veggie",icon:"🥦",color:"#42b72a"},
  {id:"clothes",icon:"👗",color:"#e91e8c"},
  {id:"other",icon:"📦",color:"#8a8d91"},
];

function fmt(a,cur,lang){
  if(cur==="eur")return(a*0.0068).toFixed(2)+" €";
  const s=lang==="ar"?"دج":"DA";
  if(a>=1000000)return(a/1000000).toFixed(1)+"م "+s;
  if(a>=1000)return(a/1000).toFixed(0)+"ك "+s;
  return a.toLocaleString()+" "+s;
}
const toDay=()=>new Date().toISOString().split("T")[0];
const toMonth=()=>new Date().toISOString().slice(0,7);

// ── STATE ──────────────────────────────────────────────────────────────────
const st0=ld();
let S={
  tab:"dash",lang:st0.lang||"ar",dark:st0.dark||false,cur:st0.cur||"dzd",
  debts:st0.debts||JSON.parse(JSON.stringify(D0)),
  pays:st0.pays||{},exps:st0.exps||[],notif:st0.notif||false,
  payMod:null,expMod:false,setMod:false,
  payF:{amount:"",note:"",month:new Date().getMonth()+1,year:new Date().getFullYear()},
  expF:{cat:"food",amount:"",note:"",date:toDay()},
  toast:null,search:"",
  _rendered:false,
};

function persist(){sv({lang:S.lang,dark:S.dark,cur:S.cur,debts:S.debts,pays:S.pays,exps:S.exps,notif:S.notif});}

// ── CLOCK: only updates clock elements, NO full re-render ──────────────────
function tickClock(){
  const now=new Date();
  const rtl=S.lang==="ar";
  const tEl=document.getElementById("clock-time");
  const dEl=document.getElementById("clock-date");
  if(tEl)tEl.textContent=now.toLocaleTimeString(rtl?"ar-DZ":"fr-DZ",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  if(dEl)dEl.textContent=now.toLocaleDateString(rtl?"ar-DZ":"fr-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
setInterval(tickClock,1000);

// ── TOAST ──────────────────────────────────────────────────────────────────
function showToast(msg,type="ok"){
  S.toast={msg,type};
  // update only toast element
  let tEl=document.getElementById("toast-el");
  if(!tEl){tEl=document.createElement("div");tEl.id="toast-el";document.getElementById("app").appendChild(tEl);}
  tEl.style.cssText=`position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:${type==="err"?"rgba(220,38,38,0.96)":"rgba(66,183,42,0.96)"};border-radius:999px;padding:11px 22px;color:#fff;font-weight:700;font-size:13px;font-family:Cairo,sans-serif;z-index:600;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,0.25);animation:ti 0.28s ease;pointer-events:none;`;
  tEl.textContent=msg;
  tEl.style.display="block";
  if(S._toastTimer)clearTimeout(S._toastTimer);
  S._toastTimer=setTimeout(()=>{if(tEl)tEl.style.display="none";},3000);
}

// ── COMPUTED ───────────────────────────────────────────────────────────────
function getPaid(id){return Object.values(S.pays[id]||{}).reduce((s,v)=>s+v.amount,0);}
function getRem(id){const d=S.debts.find(x=>x.id===id);return Math.max(0,d.total-getPaid(id));}
function getProg(id){const d=S.debts.find(x=>x.id===id);return Math.min(100,(getPaid(id)/d.total)*100);}
function getPL(id){return Object.entries(S.pays[id]||{}).sort((a,b)=>b[0].localeCompare(a[0]));}
function debtName(d){return S.lang==="ar"?d.name:d.nameFr;}
function catLbl(id){return T[S.lang][id]||id;}
function totals(){
  const tot=S.debts.reduce((s,d)=>s+d.total,0);
  const totPaid=S.debts.reduce((s,d)=>s+getPaid(d.id),0);
  return{tot,totPaid,totRem:tot-totPaid};
}

// ── ACTIONS ────────────────────────────────────────────────────────────────
function doPayment(){
  const t=T[S.lang],amt=Number(S.payF.amount);
  if(!amt||isNaN(amt)){showToast(t.amtErr,"err");return;}
  const rem=getRem(S.payMod.id);
  if(amt>rem){showToast(t.overErr,"err");return;}
  const key=`${S.payF.year}-${String(S.payF.month).padStart(2,"0")}`;
  if(!S.pays[S.payMod.id])S.pays[S.payMod.id]={};
  S.pays[S.payMod.id][key]={amount:amt,note:S.payF.note,date:new Date().toISOString()};
  const np2=Object.values(S.pays[S.payMod.id]).reduce((s,v)=>s+v.amount,0);
  const debt=S.payMod;
  if(np2>=debt.total){
    const nx=S.debts.find(d=>d.order===debt.order+1);
    if(nx&&!nx.active){nx.active=true;setTimeout(()=>showToast(`🎉 ${T[S.lang].next} ${debtName(nx)}!`),100);}
  }
  S.payMod=null;
  S.payF={amount:"",note:"",month:new Date().getMonth()+1,year:new Date().getFullYear()};
  persist();
  const msg=T[S.lang].okSave;
  render();
  setTimeout(()=>showToast(msg),50);
}
function doExp(){
  const t=T[S.lang];
  if(!S.expF.amount||isNaN(S.expF.amount)){showToast(t.amtErr,"err");return;}
  S.exps.unshift({id:Date.now(),...S.expF,amount:Number(S.expF.amount)});
  S.expMod=false;
  S.expF={cat:"food",amount:"",note:"",date:toDay()};
  persist();
  const msg=t.okExp2;
  render();
  setTimeout(()=>showToast(msg),50);
}
function delExp(id){S.exps=S.exps.filter(e=>e.id!==id);persist();render();}
function reqNotif(){
  if("Notification"in window){
    Notification.requestPermission().then(p=>{
      if(p==="granted"){S.notif=true;persist();showToast("🔔 "+T[S.lang].notifOn);}
    });
  }
}

// ── DOM HELPERS ────────────────────────────────────────────────────────────
function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object"){Object.assign(el.style,v);}
    else if(k.startsWith("on")&&typeof v==="function"){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="className"){el.className=v;}
    else el.setAttribute(k,v);
  });
  ch.flat(10).forEach(c=>{
    if(c==null||c===false||c===undefined)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return el;
}
function inp2(val,type,ph,onChange,xStyle={}){
  const el=h("input",{type:type||"text",placeholder:ph||"",style:{width:"100%",background:"var(--inp)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 14px",color:"var(--txt)",fontSize:13,outline:"none",...xStyle}});
  el.value=val||"";
  el.addEventListener("input",e=>onChange(e.target.value));
  return el;
}
function sel2(val,opts,onChange){
  const el=h("select",{style:{width:"100%",background:"var(--inp)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 14px",color:"var(--txt)",fontSize:13,outline:"none"}},
    opts.map(([v,l])=>{const o=h("option",{value:v},l);if(v==val)o.selected=true;return o;})
  );
  el.addEventListener("change",e=>onChange(e.target.value));return el;
}
function lbl2(text){return h("div",{style:{fontSize:11,color:"var(--sub)",marginBottom:5,fontWeight:600}},text);}
function progBar(pct,color){
  return h("div",{className:"prog"},h("div",{className:"pfill",style:{width:`${pct}%`,background:`linear-gradient(90deg,${color},${color}cc)`}}));
}
function badge2(text,bg,color){
  return h("span",{style:{background:bg,color,padding:"3px 10px",borderRadius:999,fontSize:10,fontWeight:700}},text);
}
function sheetMod(children,onClose){
  const ov=h("div",{className:"ov"});
  ov.addEventListener("click",e=>{if(e.target===ov)onClose();});
  const sh=h("div",{className:"sheet sd"},
    h("div",{style:{width:36,height:4,background:"var(--border)",borderRadius:999,margin:"0 auto 16px"}}),
    ...children
  );
  ov.appendChild(sh);return ov;
}

// ── MAIN RENDER (called only on state changes, NOT every second) ───────────
function render(){
  const t=T[S.lang];
  const rtl=S.lang==="ar";
  const MO=S.lang==="ar"?MAR:MFR;
  const {tot,totPaid,totRem}=totals();
  const pct=(totPaid/tot*100);

  document.body.classList.toggle("dark",S.dark);
  document.documentElement.setAttribute("dir",rtl?"rtl":"ltr");
  document.documentElement.setAttribute("lang",S.lang);

  const now=new Date();
  const tStr=now.toLocaleTimeString(rtl?"ar-DZ":"fr-DZ",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const dStr=now.toLocaleDateString(rtl?"ar-DZ":"fr-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const todayExpAmt=S.exps.filter(e=>e.date===toDay()).reduce((s,e)=>s+e.amount,0);
  const monthExpAmt=S.exps.filter(e=>(e.date||"").startsWith(toMonth())).reduce((s,e)=>s+e.amount,0);

  // ── HEADER ──
  const hdr=h("div",{style:{background:"var(--blue)",padding:"0 12px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 8px rgba(0,0,0,0.18)"}},
    h("div",{style:{maxWidth:500,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:52}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8}},
        h("div",{style:{width:34,height:34,borderRadius:999,background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},"💰"),
        h("div",{},
          h("div",{style:{fontSize:15,fontWeight:900,color:"#fff",lineHeight:1.1}},t.app),
          h("div",{style:{fontSize:9,color:"rgba(255,255,255,0.75)"}},t.sub)
        )
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("button",{className:"bs",onClick:()=>{S.lang=S.lang==="ar"?"fr":"ar";persist();render();},
          style:{background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",padding:"6px 10px",borderRadius:999,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:11}},
          S.lang==="ar"?"FR":"ع"),
        h("button",{className:"bs",onClick:()=>{S.dark=!S.dark;persist();render();},
          style:{background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",padding:"6px 10px",borderRadius:999,cursor:"pointer",fontSize:14}},
          S.dark?"☀️":"🌙"),
        h("button",{className:"bs",onClick:()=>{S.setMod=true;render();},
          style:{background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",padding:"6px 10px",borderRadius:999,cursor:"pointer",fontSize:14}},"⚙️")
      )
    )
  );

  // ── DATE/TIME BAR (IDs for live update) ──
  const dtBar=h("div",{style:{background:S.dark?"#1c1e21":"#e4e6eb",padding:"6px 14px",borderBottom:"1px solid var(--border)"}},
    h("div",{style:{maxWidth:500,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",{id:"clock-date",style:{fontSize:10,color:"var(--sub)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}},dStr),
      h("div",{id:"clock-time",style:{fontSize:12,fontWeight:900,color:"var(--blue)",fontVariantNumeric:"tabular-nums",flexShrink:0,marginRight:rtl?8:0,marginLeft:rtl?0:8}},tStr)
    )
  );

  // ── TABS ──
  const tabBar=h("div",{style:{background:"var(--hdr)",borderBottom:"1px solid var(--border)",padding:"0 10px",overflowX:"auto",WebkitOverflowScrolling:"touch",whiteSpace:"nowrap",boxShadow:"var(--shadow)"}},
    h("div",{style:{maxWidth:500,margin:"0 auto",display:"inline-flex",gap:4,padding:"6px 0"}},
      ...[["dash","📊",t.dash],["debts","💳",t.debts],["exp","🛒",t.exp],["hist","📋",t.hist],["cnt","📞",t.cnt]].map(([id,ic,lb])=>
        h("button",{className:"pill",onClick:()=>{if(S.tab===id)return;S.tab=id;render();},
          style:{background:S.tab===id?"var(--blue)":"var(--inp)",color:S.tab===id?"#fff":"var(--sub)",border:`1px solid ${S.tab===id?"var(--blue)":"var(--border)"}`}},
          ic+" "+lb)
      )
    )
  );

  // ── CONTENT ──
  const content=h("div",{style:{maxWidth:500,margin:"0 auto",padding:"12px 10px 88px"},className:"fu"});

  // ════ DASHBOARD ════
  if(S.tab==="dash"){
    content.appendChild(h("div",{style:{background:"linear-gradient(135deg,var(--blue),var(--blue4))",borderRadius:14,padding:"18px 16px",marginBottom:10,color:"#fff",boxShadow:"0 4px 16px rgba(24,119,242,0.3)"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}},
        h("div",{},h("div",{style:{fontSize:10,opacity:0.8,marginBottom:2}},t.totDebt),h("div",{style:{fontSize:24,fontWeight:900}},fmt(tot,S.cur,S.lang))),
        h("div",{style:{textAlign:rtl?"left":"right"}},h("div",{style:{fontSize:10,opacity:0.8,marginBottom:2}},t.rem),h("div",{style:{fontSize:20,fontWeight:900,color:"#ffcc00"}},fmt(totRem,S.cur,S.lang)))
      ),
      h("div",{style:{height:10,borderRadius:999,background:"rgba(255,255,255,0.25)",overflow:"hidden",marginBottom:6}},
        h("div",{style:{height:"100%",borderRadius:999,width:`${pct}%`,background:"linear-gradient(90deg,#42b72a,#a8e063)",transition:"width 1.1s"}})
      ),
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,opacity:0.85}},
        h("span",{},t.paid+": "+fmt(totPaid,S.cur,S.lang)),
        h("span",{style:{fontWeight:900}},pct.toFixed(1)+"%")

  if(setModalEl)wrap.appendChild(setModalEl);

  // preserve toast if exists
  const oldToast=document.getElementById("toast-el");
  app.innerHTML="";
  app.appendChild(wrap);
  if(oldToast&&oldToast.style.display!=="none"){
    app.appendChild(oldToast);
  }
}

// ── START ──
render();
tickClock();
</script>
</body>
</html>
