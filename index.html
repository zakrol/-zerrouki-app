<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f0f0f"/>
<title>ديون زروقي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cairo',sans-serif;background:#0f0f0f;color:#f1f1f1;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:2px;height:2px;}
::-webkit-scrollbar-thumb{background:#ff0000;border-radius:2px;}
.hov{transition:all 0.22s;}
.hov:active{transform:scale(0.97);opacity:0.85;}
.bs{transition:transform 0.18s;} .bs:active{transform:scale(0.95);}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu 0.32s ease forwards;}
@keyframes sd{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.sd{animation:sd 0.28s cubic-bezier(.2,.8,.4,1) forwards;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}} .pulse{animation:pulse 2s infinite;}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.prog{height:6px;border-radius:999px;overflow:hidden;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:500px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:20px 16px 36px;}
.pill{padding:5px 12px;border-radius:999px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:11px;transition:all 0.2s;white-space:nowrap;}
input,select{-webkit-appearance:none;appearance:none;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);}
select option{background:#1a1a1a;color:#f1f1f1;}
.cbtn{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;transition:transform 0.18s;width:100%;margin-bottom:10px;}
.cbtn:active{transform:scale(0.97);}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ─── STORAGE using localStorage ────────────────────────────────────────────
const SK = "zerrouki-v4";
const loadData = () => { try { return JSON.parse(localStorage.getItem(SK)||"{}"); } catch { return {}; } };
const saveData = (d) => { try { localStorage.setItem(SK, JSON.stringify(d)); } catch {} };

// ─── DATA ──────────────────────────────────────────────────────────────────
const PHONE = "+213776728421";
const MONTHS_AR = ["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const MONTHS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const T = {
  ar:{appName:"ديون زروقي",appSub:"مدير الديون الذكي",dashboard:"الرئيسية",debts:"الديون",expenses:"المصاريف",history:"السجل",contact:"تواصل",
    totalDebt:"إجمالي الديون",totalPaid:"تم الدفع",remaining:"المتبقي",paid:"مدفوع",add:"+ أضف",
    addPayment:"تسجيل دفعة",newExpense:"مصروف جديد",amount:"المبلغ",month:"الشهر",year:"السنة",note:"ملاحظة",
    confirmPay:"✅ تأكيد الدفعة",confirmExp:"✅ تأكيد المصروف",payHistory:"سجل الدفعات",fullHistory:"السجل الكامل",
    noPayments:"لا توجد دفعات بعد",noExpenses:"لا توجد مصاريف",todayExp:"مصاريف اليوم",thisMonth:"هذا الشهر",
    active:"نشط الآن",waiting:"في الانتظار",completed:"مكتمل",monthsLeft:"شهر متبقي",
    originalAmt:"المبلغ الأصلي",payments:"دفعة",contactUs:"تواصل معنا",contactDesc:"تواصل مع صاحب التطبيق عبر:",callUs:"اتصال مباشر",
    food:"مواد غذائية",veggie:"خضر وفواكه",clothes:"ملابس",other:"أخرى",type:"النوع",date:"التاريخ",
    darkMode:"الوضع الليلي",lightMode:"الوضع النهاري",currency:"العملة",lang:"اللغة",
    amtErr:"أدخل مبلغاً صحيحاً",overErr:"المبلغ أكبر من المتبقي!",savedOk:"✅ تم تسجيل الدفعة",expSaved:"✅ تم تسجيل المصروف",
    nextActive:"انتهيت! بدأ دور",settings:"الإعدادات",enableNotif:"تفعيل التنبيهات الشهرية",notifOn:"✅ التنبيهات مفعّلة",
    notifPlaceholder:"دفعة شهر جانفي",
  },
  fr:{appName:"Dettes Zerrouki",appSub:"Gestionnaire de dettes",dashboard:"Accueil",debts:"Dettes",expenses:"Dépenses",history:"Historique",contact:"Contact",
    totalDebt:"Total dettes",totalPaid:"Payé",remaining:"Restant",paid:"Payé",add:"+ Ajouter",
    addPayment:"Enregistrer paiement",newExpense:"Nouvelle dépense",amount:"Montant",month:"Mois",year:"Année",note:"Note",
    confirmPay:"✅ Confirmer paiement",confirmExp:"✅ Confirmer dépense",payHistory:"Historique",fullHistory:"Historique complet",
    noPayments:"Aucun paiement",noExpenses:"Aucune dépense",todayExp:"Dépenses aujourd'hui",thisMonth:"Ce mois",
    active:"Actif",waiting:"En attente",completed:"Terminé",monthsLeft:"mois restants",
    originalAmt:"Montant initial",payments:"paiement",contactUs:"Nous contacter",contactDesc:"Contactez via:",callUs:"Appeler",
    food:"Alimentation",veggie:"Légumes & fruits",clothes:"Vêtements",other:"Autre",type:"Type",date:"Date",
    darkMode:"Mode sombre",lightMode:"Mode clair",currency:"Devise",lang:"Langue",
    amtErr:"Entrez un montant valide",overErr:"Montant trop élevé!",savedOk:"✅ Paiement enregistré",expSaved:"✅ Dépense enregistrée",
    nextActive:"Terminé! Au tour de",settings:"Paramètres",enableNotif:"Activer rappels mensuels",notifOn:"✅ Notifications activées",
    notifPlaceholder:"Paiement janvier",
  }
};

const DEBTS0 = [
  {id:"faqir",name:"فقير محمد",nameFr:"Faquir Mohamed",icon:"👨",total:35000000,monthly:1000000,color:"#ff6b35",active:true,order:1},
  {id:"moussaoui",name:"موساوي فاطمة",nameFr:"Moussaoui Fatima",icon:"👩",total:26000000,monthly:1000000,color:"#ff4d8d",active:false,order:2},
  {id:"sabria",name:"زروقي صابرية",nameFr:"Zerrouki Sabria",icon:"👩‍🦱",total:5000000,monthly:1000000,color:"#00d4ff",active:false,order:3},
  {id:"tawfiq",name:"زروقي توفيق",nameFr:"Zerrouki Tawfiq",icon:"👨‍🦰",total:5000000,monthly:1000000,color:"#a855f7",active:false,order:4},
];
const CATS = [
  {id:"food",icon:"🛒",color:"#ff6b35"},
  {id:"veggie",icon:"🥦",color:"#22c55e"},
  {id:"clothes",icon:"👗",color:"#ff4d8d"},
  {id:"other",icon:"📦",color:"#94a3b8"},
];

// ─── HELPERS ──────────────────────────────────────────────────────────────
function fmt(amount, cur, lang) {
  if(cur==="eur"){return(amount*0.0068).toFixed(2)+" €";}
  const s=lang==="ar"?"دج":"DA";
  if(amount>=1000000)return(amount/1000000).toFixed(1)+"م "+s;
  if(amount>=1000)return(amount/1000).toFixed(0)+"ك "+s;
  return amount.toLocaleString()+" "+s;
}
function todayISO(){return new Date().toISOString().split("T")[0];}
function monthISO(){return new Date().toISOString().slice(0,7);}

// ─── APP STATE ────────────────────────────────────────────────────────────
const stored = loadData();
let state = {
  tab: "dashboard",
  lang: stored.lang||"ar",
  dark: stored.dark!==undefined?stored.dark:true,
  cur: stored.cur||"dzd",
  debts: stored.debts||JSON.parse(JSON.stringify(DEBTS0)),
  pays: stored.pays||{},
  exps: stored.exps||[],
  notif: stored.notif||false,
  payMod: null,
  expMod: false,
  setMod: false,
  payF: {amount:"",note:"",month:new Date().getMonth()+1,year:new Date().getFullYear()},
  expF: {cat:"food",amount:"",note:"",date:todayISO()},
  toast: null,
  clock: new Date(),
};

function persist(){
  saveData({lang:state.lang,dark:state.dark,cur:state.cur,debts:state.debts,pays:state.pays,exps:state.exps,notif:state.notif});
}

// clock
setInterval(()=>{state.clock=new Date();render();},1000);

// toast
function showToast(msg,type="ok"){
  state.toast={msg,type};
  render();
  setTimeout(()=>{state.toast=null;render();},3000);
}

// ─── COMPUTED ─────────────────────────────────────────────────────────────
function getPaid(id){return Object.values(state.pays[id]||{}).reduce((s,v)=>s+v.amount,0);}
function getRem(id){const d=state.debts.find(x=>x.id===id);return Math.max(0,d.total-getPaid(id));}
function getProg(id){const d=state.debts.find(x=>x.id===id);return Math.min(100,(getPaid(id)/d.total)*100);}
function getPL(id){return Object.entries(state.pays[id]||{}).sort((a,b)=>b[0].localeCompare(a[0]));}
function totals(){
  const tot=state.debts.reduce((s,d)=>s+d.total,0);
  const totPaid=state.debts.reduce((s,d)=>s+getPaid(d.id),0);
  return{tot,totPaid,totRem:tot-totPaid};
}
function todayExpAmt(){return state.exps.filter(e=>e.date===todayISO()).reduce((s,e)=>s+e.amount,0);}
function monthExpAmt(){return state.exps.filter(e=>(e.date||"").startsWith(monthISO())).reduce((s,e)=>s+e.amount,0);}

// ─── THEME ────────────────────────────────────────────────────────────────
function C(){
  const d=state.dark;
  return d?{
    bg:"#0f0f0f",card:"#1a1a1a",card2:"rgba(255,255,255,0.04)",border:"rgba(255,255,255,0.09)",
    borderA:"rgba(255,30,30,0.4)",hdr:"rgba(10,10,10,0.98)",txt:"#f1f1f1",sub:"#999",mut:"#555",
    acc:"#ff0000",accL:"rgba(255,0,0,0.1)",inp:"rgba(255,255,255,0.07)",modal:"#161616",
    green:"#4ade80",red:"#ff4444",prog:"rgba(255,255,255,0.08)",
  }:{
    bg:"#f5f5f5",card:"#ffffff",card2:"rgba(0,0,0,0.03)",border:"rgba(0,0,0,0.09)",
    borderA:"rgba(200,0,0,0.3)",hdr:"rgba(255,255,255,0.98)",txt:"#111",sub:"#555",mut:"#888",
    acc:"#cc0000",accL:"rgba(200,0,0,0.07)",inp:"rgba(0,0,0,0.06)",modal:"#fafafa",
    green:"#16a34a",red:"#dc2626",prog:"rgba(0,0,0,0.08)",
  };
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────
function doPayment(){
  const t=T[state.lang];
  const amt=Number(state.payF.amount);
  if(!amt||isNaN(amt)){showToast(t.amtErr,"err");return;}
  const rem=getRem(state.payMod.id);
  if(amt>rem){showToast(t.overErr,"err");return;}
  const key=`${state.payF.year}-${String(state.payF.month).padStart(2,"0")}`;
  if(!state.pays[state.payMod.id])state.pays[state.payMod.id]={};
  state.pays[state.payMod.id][key]={amount:amt,note:state.payF.note,date:new Date().toISOString()};
  const np2=Object.values(state.pays[state.payMod.id]).reduce((s,v)=>s+v.amount,0);
  const debt=state.payMod;
  if(np2>=debt.total){
    const nx=state.debts.find(d=>d.order===debt.order+1);
    if(nx&&!nx.active){nx.active=true;showToast(`${t.nextActive} ${state.lang==="ar"?nx.name:nx.nameFr}!`);}
  }
  state.payMod=null;
  state.payF={amount:"",note:"",month:new Date().getMonth()+1,year:new Date().getFullYear()};
  persist();
  showToast(t.savedOk);
}

function doExp(){
  const t=T[state.lang];
  if(!state.expF.amount||isNaN(state.expF.amount)){showToast(t.amtErr,"err");return;}
  state.exps.unshift({id:Date.now(),...state.expF,amount:Number(state.expF.amount)});
  state.expMod=false;
  state.expF={cat:"food",amount:"",note:"",date:todayISO()};
  persist();
  showToast(t.expSaved);
}

function reqNotif(){
  if("Notification"in window){
    Notification.requestPermission().then(p=>{
      if(p==="granted"){state.notif=true;persist();showToast("✅ "+T[state.lang].notifOn);}
    });
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object"){Object.assign(el.style,v);}
    else if(k.startsWith("on")&&typeof v==="function"){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="className"){el.className=v;}
    else{el.setAttribute(k,v);}
  });
  children.flat(10).forEach(c=>{
    if(c==null||c===false||c===undefined)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return el;
}

function card(style={},children=[]){
  const c=C();
  return h("div",{style:{background:c.card,border:`1px solid ${c.border}`,borderRadius:16,padding:14,transition:"all 0.22s",...style}},children);
}
function inp(id,val,type,ph,onChange){
  const c=C();
  const el=h("input",{type:type||"text",value:val||"",placeholder:ph||"",style:{width:"100%",background:c.inp,border:`1px solid ${c.border}`,borderRadius:12,padding:"11px 14px",color:c.txt,fontFamily:"Cairo",fontSize:13,outline:"none"}});
  el.value=val||"";
  el.addEventListener("input",e=>onChange(e.target.value));
  return el;
}
function sel(val,options,onChange){
  const c=C();
  const el=h("select",{style:{width:"100%",background:c.inp,border:`1px solid ${c.border}`,borderRadius:12,padding:"11px 14px",color:c.txt,fontFamily:"Cairo",fontSize:13,outline:"none"}},
    options.map(([v,l])=>{const o=h("option",{value:v},l);if(v==val)o.selected=true;return o;})
  );
  el.addEventListener("change",e=>onChange(e.target.value));
  return el;
}
function lbl(text){
  const c=C();
  return h("div",{style:{fontSize:11,color:c.mut,marginBottom:5}},text);
}
function tog(on,onClick){
  return h("div",{onClick,style:{width:48,height:26,borderRadius:999,background:on?"#ff0000":"#555",position:"relative",cursor:"pointer",transition:"background 0.3s",flexShrink:0}},
    h("div",{style:{width:20,height:20,borderRadius:"50%",background:"#fff",position:"absolute",top:3,left:on?24:4,transition:"left 0.25s"}})
  );
}
function progBar(pct,color){
  const c=C();
  return h("div",{className:"prog",style:{background:c.prog}},
    h("div",{style:{height:"100%",borderRadius:999,width:`${pct}%`,background:`linear-gradient(90deg,${color},${color}99)`,transition:"width 1.2s"}})
  );
}
function badge(text,bg,color){
  return h("span",{style:{background:bg,color,padding:"2px 9px",borderRadius:999,fontSize:10,fontWeight:700}},text);
}
function sheetModal(children,onClose){
  const c=C();
  const ov=h("div",{className:"ov",onClick:e=>{if(e.target===ov)onClose();}});
  const sheet=h("div",{className:"sheet sd",style:{background:c.modal,border:`1px solid ${c.border}`}},
    h("div",{style:{width:38,height:4,background:c.border,borderRadius:999,margin:"0 auto 18px"}}),
    ...children
  );
  ov.appendChild(sheet);
  return ov;
}

function render(){
  const c=C();
  const t=T[state.lang];
  const rtl=state.lang==="ar";
  const MO=state.lang==="ar"?MONTHS_AR:MONTHS_FR;
  const {tot,totPaid,totRem}=totals();

  document.documentElement.setAttribute("dir",rtl?"rtl":"ltr");
  document.documentElement.setAttribute("lang",state.lang);
  document.body.style.background=c.bg;
  document.body.style.color=c.txt;

  function debtName(d){return rtl?d.name:d.nameFr;}
  function catLbl(id){return t[id];}

  const tStr=state.clock.toLocaleTimeString(rtl?"ar-DZ":"fr-DZ",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const dStr=state.clock.toLocaleDateString(rtl?"ar-DZ":"fr-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

  // ── HEADER ──
  const header=h("div",{style:{background:c.hdr,borderBottom:`1px solid ${c.border}`,padding:"10px 14px",position:"sticky",top:0,zIndex:100}},
    h("div",{style:{maxWidth:500,margin:"0 auto"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8}},
          h("div",{style:{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#ff0000,#cc0000)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},
            "💰"),
          h("div",{},
            h("div",{style:{fontSize:15,fontWeight:900,color:c.acc,lineHeight:1.1}},t.appName),
            h("div",{style:{fontSize:10,color:c.mut}},t.appSub)
          )
        ),
        h("div",{style:{display:"flex",gap:5,alignItems:"center"}},
          h("button",{className:"bs",onClick:()=>{state.lang=state.lang==="ar"?"fr":"ar";persist();render();},
            style:{border:`1px solid ${c.border}`,background:c.inp,color:c.sub,padding:"5px 9px",borderRadius:9,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:11}},
            state.lang==="ar"?"FR":"ع"),
          h("button",{className:"bs",onClick:()=>{state.dark=!state.dark;persist();render();},
            style:{border:`1px solid ${c.border}`,background:c.inp,color:c.sub,padding:"5px 9px",borderRadius:9,cursor:"pointer",fontSize:14}},
            state.dark?"☀️":"🌙"),
          h("button",{className:"bs",onClick:()=>{state.setMod=true;render();},
            style:{border:`1px solid ${c.border}`,background:c.inp,color:c.sub,padding:"5px 9px",borderRadius:9,cursor:"pointer",fontSize:14}},"⚙️")
        )
      ),
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 12px",background:c.inp,borderRadius:10,border:`1px solid ${c.border}`}},
        h("div",{style:{fontSize:10,color:c.mut,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}},dStr),
        h("div",{style:{fontSize:13,fontWeight:900,color:c.acc,fontVariantNumeric:"tabular-nums",flexShrink:0,marginRight:rtl?8:0,marginLeft:rtl?0:8}},tStr)
      )
    )
  );

  // ── TAB BAR ──
  const tabs=h("div",{style:{background:c.hdr,borderBottom:`1px solid ${c.border}`,padding:"7px 14px",overflowX:"auto",WebkitOverflowScrolling:"touch",whiteSpace:"nowrap"}},
    h("div",{style:{maxWidth:500,margin:"0 auto",display:"inline-flex",gap:5}},
      ...[["dashboard","📊",t.dashboard],["debts","💳",t.debts],["expenses","🛒",t.expenses],["history","📋",t.history],["contact","📞",t.contact]].map(([id,ic,lb])=>
        h("button",{className:"pill",onClick:()=>{state.tab=id;render();},
          style:{background:state.tab===id?"#ff0000":c.card2,color:state.tab===id?"#fff":c.sub,border:`1px solid ${state.tab===id?"#ff0000":c.border}`}},
          ic+" "+lb)
      )
    )
  );

  // ── CONTENT ──
  let content=h("div",{style:{maxWidth:500,margin:"0 auto",padding:"14px 12px 90px"},className:"fu"});

  if(state.tab==="dashboard"){
    // hero
    content.appendChild(h("div",{style:{background:state.dark?"linear-gradient(135deg,#1c0000,#280404)":"linear-gradient(135deg,#fff5f5,#ffe4e4)",border:`1px solid ${c.borderA}`,borderRadius:18,padding:"20px 16px",marginBottom:12,textAlign:"center"}},
      h("div",{style:{fontSize:11,color:state.dark?"#ff8888":c.acc,marginBottom:4}},t.remaining),
      h("div",{style:{fontSize:28,fontWeight:900,color:c.red,letterSpacing:"-1px",marginBottom:8}},fmt(totRem,state.cur,state.lang)),
      progBar((totPaid/tot)*100,"#ff0000"),
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,color:c.mut,marginTop:5}},
        h("span",{},t.paid+": "+fmt(totPaid,state.cur,state.lang)),
        h("span",{},((totPaid/tot)*100).toFixed(1)+"%"),
        h("span",{},t.totalDebt+": "+fmt(tot,state.cur,state.lang))
      )
    ));
    // stats
    const sg=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}});
    [{l:t.todayExp,v:fmt(todayExpAmt(),state.cur,state.lang),col:"#ff6b35"},{l:t.thisMonth,v:fmt(monthExpAmt(),state.cur,state.lang),col:"#a855f7"}].forEach(s=>{
      sg.appendChild(card({textAlign:"center"},[h("div",{style:{fontSize:10,color:c.mut,marginBottom:4}},s.l),h("div",{style:{fontSize:18,fontWeight:900,color:s.col}},s.v)]));
    });
    content.appendChild(sg);
    // debt cards
    state.debts.forEach(d=>{
      const rem=getRem(d.id);const prog=getProg(d.id);const done=rem===0;const pl=getPL(d.id);
      const dc=card({marginBottom:10,border:`1px solid ${done?"rgba(74,222,128,0.3)":d.active?"rgba(255,0,0,0.25)":c.border}`,cursor:d.active&&!done?"pointer":"default"});
      dc.classList.add("hov");
      if(d.active&&!done)dc.addEventListener("click",()=>{state.payMod=d;state.payF={amount:String(d.monthly),note:"",month:new Date().getMonth()+1,year:new Date().getFullYear()};render();});
      // row1
      const r1=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}});
      r1.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:10}},
        h("div",{style:{width:42,height:42,borderRadius:12,background:`${d.color}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:21,border:`2px solid ${d.color}40`,flexShrink:0}},d.icon),
        h("div",{},
          h("div",{style:{fontWeight:700,fontSize:14}},debtName(d)),
          h("div",{style:{fontSize:10,marginTop:2}},
            done?h("span",{style:{color:c.green}},"✅ "+t.completed):
            d.active?h("span",{className:"pulse",style:{color:c.green}},"● "+t.active):
            h("span",{style:{color:c.mut}},"⏸ "+t.waiting)
          )
        )
      ));
      r1.appendChild(h("div",{style:{textAlign:rtl?"left":"right",flexShrink:0}},
        h("div",{style:{fontSize:10,color:c.mut}},t.remaining),
        h("div",{style:{fontSize:15,fontWeight:900,color:done?c.green:c.red}},fmt(rem,state.cur,state.lang))
      ));
      dc.appendChild(r1);
      dc.appendChild(progBar(prog,d.color));
      dc.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:10,color:c.mut}},
        h("span",{},fmt(getPaid(d.id),state.cur,state.lang)),h("span",{},prog.toFixed(1)+"%")
      ));
      if(!done&&pl.length>0){
        dc.appendChild(h("div",{style:{marginTop:8,padding:"6px 10px",background:c.card2,borderRadius:8,fontSize:10,display:"flex",justifyContent:"space-between",border:`1px solid ${c.border}`}},
          h("span",{style:{color:c.mut}},"آخر دفعة"),
          h("span",{style:{color:d.color,fontWeight:700}},fmt(pl[0][1].amount,state.cur,state.lang)+" — "+pl[0][0].replace("-","/"))
        ));
      }
      if(d.active&&!done){
        dc.appendChild(h("div",{style:{marginTop:10,padding:"9px",background:c.accL,borderRadius:10,textAlign:"center",border:`1px dashed rgba(255,0,0,0.3)`}},
          h("span",{style:{color:c.acc,fontSize:12,fontWeight:700}},"💸 "+t.addPayment)
        ));
      }
      content.appendChild(dc);
    });
    // quick add exp
    const qb=h("button",{className:"bs",onClick:()=>{state.expMod=true;render();},
      style:{width:"100%",padding:"13px",background:"linear-gradient(135deg,#ff6b35,#ff4500)",color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:13,marginTop:4}},
      "🛒 + "+t.newExpense);
    content.appendChild(qb);
  }

  else if(state.tab==="debts"){
    state.debts.forEach(d=>{
      const paid=getPaid(d.id);const rem=getRem(d.id);const prog=getProg(d.id);const done=rem===0;const months=Math.ceil(rem/d.monthly);
      const dc=h("div",{style:{background:c.card,border:`1px solid ${done?"rgba(74,222,128,0.3)":d.active?"rgba(255,0,0,0.22)":c.border}`,borderRadius:18,padding:16,marginBottom:14}});
      dc.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:14}},
        h("div",{style:{width:50,height:50,borderRadius:16,background:`${d.color}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,border:`2px solid ${d.color}`,flexShrink:0}},d.icon),
        h("div",{style:{flex:1}},
          h("div",{style:{fontWeight:900,fontSize:16}},debtName(d)),
          h("div",{style:{display:"flex",gap:6,marginTop:5,flexWrap:"wrap"}},
            badge(done?"✅ "+t.completed:d.active?"● "+t.active:"⏸ "+t.waiting,`${d.color}20`,d.color),
            !done?badge(months+" "+t.monthsLeft,"rgba(239,68,68,0.1)",c.red):null
          )
        )
      ));
      const grid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}});
      [{l:t.originalAmt,v:fmt(d.total,state.cur,state.lang),col:c.sub},{l:t.totalPaid,v:fmt(paid,state.cur,state.lang),col:c.green},{l:t.remaining,v:fmt(rem,state.cur,state.lang),col:c.red}].forEach(s=>{
        grid.appendChild(h("div",{style:{background:c.card2,borderRadius:10,padding:"10px 6px",textAlign:"center",border:`1px solid ${c.border}`}},
          h("div",{style:{fontSize:12,fontWeight:900,color:s.col}},s.v),
          h("div",{style:{fontSize:9,color:c.mut,marginTop:2}},s.l)
        ));
      });
      dc.appendChild(grid);
      dc.appendChild(progBar(prog,d.color));
      dc.appendChild(h("div",{style:{textAlign:"center",fontSize:11,color:d.color,fontWeight:700,margin:"4px 0 10px"}},prog.toFixed(2)+"%"));
      if(d.active&&!done){
        const pb=h("button",{className:"bs",onClick:()=>{state.payMod=d;state.payF={amount:String(d.monthly),note:"",month:new Date().getMonth()+1,year:new Date().getFullYear()};render();},
          style:{width:"100%",padding:"12px",background:`linear-gradient(135deg,${d.color},${d.color}cc)`,color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:13,marginBottom:12}},
          "💸 "+t.addPayment);
        dc.appendChild(pb);
      }
      const pl=getPL(d.id);
      if(pl.length>0){
        dc.appendChild(h("div",{style:{fontSize:11,color:c.mut,fontWeight:700,marginBottom:6}},"📋 "+t.payHistory));
        const plist=h("div",{style:{maxHeight:160,overflowY:"auto",display:"grid",gap:5}});
        pl.forEach(([k,p])=>{
          plist.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:c.card2,borderRadius:10,border:`1px solid ${c.border}`}},
            h("div",{},h("div",{style:{fontSize:12,fontWeight:700,color:d.color}},fmt(p.amount,state.cur,state.lang)),p.note?h("div",{style:{fontSize:10,color:c.mut}},p.note):""),
            h("div",{style:{textAlign:rtl?"left":"right",fontSize:10,color:c.mut}},h("div",{},MO[parseInt(k.split("-")[1])-1]),h("div",{},k.split("-")[0]))
          ));
        });
        dc.appendChild(plist);
      }
      content.appendChild(dc);
    });
  }

  else if(state.tab==="expenses"){
    content.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h("div",{style:{fontWeight:900,fontSize:17}},"🛒 "+t.expenses),
      h("button",{className:"bs",onClick:()=>{state.expMod=true;render();},
        style:{padding:"9px 16px",background:"#ff0000",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:12}},
        state.lang==="ar"?"+ جديد":"+ Nouveau")
    ));
    const cg=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}});
    CATS.forEach(ct=>{
      const total=state.exps.filter(e=>e.cat===ct.id).reduce((s,e)=>s+e.amount,0);
      cg.appendChild(card({textAlign:"center",padding:"13px 10px"},[
        h("div",{style:{fontSize:22}},ct.icon),
        h("div",{style:{fontSize:14,fontWeight:900,color:ct.color,marginTop:4}},fmt(total,state.cur,state.lang)),
        h("div",{style:{fontSize:10,color:c.mut}},catLbl(ct.id))
      ]));
    });
    content.appendChild(cg);
    if(!state.exps.length){content.appendChild(h("div",{style:{textAlign:"center",color:c.mut,padding:40}},t.noExpenses));}
    state.exps.forEach(e=>{
      const ct=CATS.find(x=>x.id===e.cat);
      content.appendChild(h("div",{style:{background:c.card,border:`1px solid ${ct.color}25`,borderRadius:14,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
        h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
          h("div",{style:{width:36,height:36,borderRadius:10,background:`${ct.color}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}},ct.icon),
          h("div",{},h("div",{style:{fontSize:12,fontWeight:700}},catLbl(ct.id)),e.note?h("div",{style:{fontSize:10,color:c.mut}},e.note):"")
        ),
        h("div",{style:{textAlign:rtl?"left":"right",flexShrink:0}},
          h("div",{style:{fontSize:14,fontWeight:900,color:ct.color}},fmt(e.amount,state.cur,state.lang)),
          h("div",{style:{fontSize:10,color:c.mut}},e.date)
        )
      ));
    });
  }

  else if(state.tab==="history"){
    content.appendChild(h("div",{style:{fontWeight:900,fontSize:17,marginBottom:14}},"📋 "+t.fullHistory));
    let hasAny=false;
    state.debts.forEach(d=>{
      const pl=getPL(d.id);if(!pl.length)return;hasAny=true;
      content.appendChild(h("div",{style:{marginBottom:20}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
          h("span",{},d.icon),
          h("span",{style:{fontWeight:700,color:d.color}},debtName(d)),
          h("span",{style:{fontSize:10,color:c.mut}},"("+pl.length+" "+t.payments+")")
        ),
        ...pl.map(([k,p])=>h("div",{style:{background:c.card,border:`1px solid ${d.color}18`,borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
          h("div",{},h("div",{style:{fontWeight:700,color:d.color,fontSize:13}},fmt(p.amount,state.cur,state.lang)),p.note?h("div",{style:{fontSize:10,color:c.mut}},p.note):""),
          h("div",{style:{textAlign:rtl?"left":"right"}},h("div",{style:{fontSize:11,fontWeight:700,color:c.sub}},MO[parseInt(k.split("-")[1])-1]),h("div",{style:{fontSize:10,color:c.mut}},k.split("-")[0]))
        ))
      ));
    });
    if(!hasAny)content.appendChild(h("div",{style:{textAlign:"center",color:c.mut,padding:40}},t.noPayments));
  }

  else if(state.tab==="contact"){
    content.appendChild(h("div",{style:{background:state.dark?"linear-gradient(135deg,#1c0000,#280404)":"linear-gradient(135deg,#fff5f5,#fce8e8)",border:`1px solid ${c.borderA}`,borderRadius:18,padding:"20px 16px",textAlign:"center",marginBottom:16}},
      h("div",{style:{fontSize:36,marginBottom:8}},"💰"),
      h("div",{style:{fontSize:17,fontWeight:900,color:c.acc,marginBottom:4}},t.appName),
      h("div",{style:{fontSize:12,color:c.mut}},t.contactDesc)
    ));
    [
      {href:`https://wa.me/${PHONE.replace("+","")}`,bg:"linear-gradient(135deg,#25D366,#128C7E)",icon:"💬",name:"WhatsApp",info:PHONE},
      {href:`https://t.me/${PHONE.replace("+","")}`,bg:"linear-gradient(135deg,#0088cc,#006ba3)",icon:"✈️",name:"Telegram",info:PHONE},
      {href:"https://facebook.com",bg:"linear-gradient(135deg,#1877F2,#0c5ed4)",icon:"📘",name:"Facebook",info:"Zerrouki"},
      {href:`tel:${PHONE}`,bg:`linear-gradient(135deg,${c.acc},#cc0000)`,icon:"📞",name:t.callUs,info:PHONE},
    ].forEach(b=>{
      const a=h("a",{href:b.href,target:"_blank",rel:"noopener noreferrer",style:{textDecoration:"none"}});
      const btn=h("button",{className:"cbtn",style:{background:b.bg,color:"#fff",direction:rtl?"rtl":"ltr"}},
        h("span",{style:{fontSize:26,flexShrink:0}},b.icon),
        h("div",{style:{textAlign:rtl?"right":"left"}},h("div",{style:{fontWeight:900}},b.name),h("div",{style:{fontSize:11,opacity:0.85}},b.info))
      );
      a.appendChild(btn);content.appendChild(a);
    });
  }

  // ── BOTTOM NAV ──
  const nav=h("div",{style:{position:"fixed",bottom:0,left:0,right:0,background:c.hdr,borderTop:`1px solid ${c.border}`,padding:"7px 0 8px",zIndex:99}},
    h("div",{style:{display:"flex",justifyContent:"space-around",maxWidth:500,margin:"0 auto"}},
      ...[["dashboard","📊",t.dashboard],["debts","💳",t.debts],["expenses","🛒",t.expenses],["history","📋",t.history],["contact","📞",t.contact]].map(([id,ic,lb])=>
        h("button",{className:"bs",onClick:()=>{state.tab=id;render();},
          style:{display:"flex",flexDirection:"column",alignItems:"center",gap:1,padding:"4px 10px",background:"transparent",border:"none",cursor:"pointer",color:state.tab===id?"#ff0000":c.mut,fontFamily:"Cairo",fontWeight:700,fontSize:9,transition:"all 0.2s"}},
          h("span",{style:{fontSize:state.tab===id?22:18,transition:"font-size 0.2s"}},ic),lb)
      )
    )
  );

  // ── PAY MODAL ──
  let payModal=null;
  if(state.payMod){
    const d=state.payMod;
    payModal=sheetModal([
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}},
        h("div",{},h("div",{style:{fontWeight:900,fontSize:16}},"💸 "+t.addPayment),h("div",{style:{fontSize:11,color:d.color,marginTop:2}},debtName(d)+" — "+t.remaining+": "+fmt(getRem(d.id),state.cur,state.lang))),
        h("button",{onClick:()=>{state.payMod=null;render();},style:{background:c.inp,border:`1px solid ${c.border}`,color:c.mut,padding:"5px 11px",borderRadius:9,cursor:"pointer",fontSize:15}},"✕")
      ),
      lbl(t.amount),
      (()=>{const i=inp("amt",state.payF.amount,"number","1000000",v=>{state.payF.amount=v;});return i;})(),
      h("div",{style:{height:11}}),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h("div",{},lbl(t.month),sel(state.payF.month,MO.map((m,i)=>[i+1,m]),v=>{state.payF.month=Number(v);render();})),
        h("div",{},lbl(t.year),sel(state.payF.year,[2026,2027,2028,2029,2030].map(y=>[y,y]),v=>{state.payF.year=Number(v);render();}))
      ),
      h("div",{style:{height:11}}),
      lbl(t.note),
      (()=>{const i=inp("note",state.payF.note,"text",t.notifPlaceholder||"...",v=>{state.payF.note=v;});return i;})(),
      h("div",{style:{height:11}}),
      h("button",{className:"bs",onClick:doPayment,style:{width:"100%",padding:"13px",background:`linear-gradient(135deg,${d.color},${d.color}cc)`,color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:14}},t.confirmPay)
    ],()=>{state.payMod=null;render();});
  }

  // ── EXP MODAL ──
  let expModal=null;
  if(state.expMod){
    expModal=sheetModal([
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
        h("div",{style:{fontWeight:900,fontSize:16}},"🛒 "+t.newExpense),
        h("button",{onClick:()=>{state.expMod=false;render();},style:{background:c.inp,border:`1px solid ${c.border}`,color:c.mut,padding:"5px 11px",borderRadius:9,cursor:"pointer",fontSize:15}},"✕")
      ),
      lbl(t.type),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:11}},
        ...CATS.map(ct=>h("button",{className:"bs",onClick:()=>{state.expF.cat=ct.id;render();},
          style:{padding:"10px",background:state.expF.cat===ct.id?`${ct.color}20`:c.inp,border:`1px solid ${state.expF.cat===ct.id?ct.color:c.border}`,color:state.expF.cat===ct.id?ct.color:c.sub,borderRadius:12,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:12}},
          ct.icon+" "+catLbl(ct.id)))
      ),
      lbl(t.amount),
      (()=>{const i=inp("eamt",state.expF.amount,"number","500000",v=>{state.expF.amount=v;});return i;})(),
      h("div",{style:{height:11}}),
      lbl(t.date),
      (()=>{const i=inp("edate",state.expF.date,"date","",v=>{state.expF.date=v;});return i;})(),
      h("div",{style:{height:11}}),
      lbl(t.note),
      (()=>{const i=inp("enote",state.expF.note,"text",state.lang==="ar"?"مثال: خضر من السوق":"Ex: légumes marché",v=>{state.expF.note=v;});return i;})(),
      h("div",{style:{height:11}}),
      h("button",{className:"bs",onClick:doExp,style:{width:"100%",padding:"13px",background:"linear-gradient(135deg,#ff6b35,#ff4500)",color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:14}},t.confirmExp)
    ],()=>{state.expMod=false;render();});
  }

  // ── SETTINGS MODAL ──
  let setModal=null;
  if(state.setMod){
    setModal=sheetModal([
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
        h("div",{style:{fontWeight:900,fontSize:16}},"⚙️ "+t.settings),
        h("button",{onClick:()=>{state.setMod=false;render();},style:{background:c.inp,border:`1px solid ${c.border}`,color:c.mut,padding:"5px 11px",borderRadius:9,cursor:"pointer",fontSize:15}},"✕")
      ),
      // dark
      h("div",{style:{background:c.card2,border:`1px solid ${c.border}`,borderRadius:14,padding:14,marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
          h("span",{style:{fontSize:20}},state.dark?"🌙":"☀️"),
          h("div",{},h("div",{style:{fontWeight:700,fontSize:13}},state.dark?t.darkMode:t.lightMode))
        ),
        tog(state.dark,()=>{state.dark=!state.dark;persist();render();})
      ),
      // lang
      h("div",{style:{background:c.card2,border:`1px solid ${c.border}`,borderRadius:14,padding:14,marginBottom:12}},
        h("div",{style:{fontWeight:700,fontSize:13,marginBottom:10}},"🌍 "+t.lang),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          ...[ ["ar","عربي 🇩🇿"],["fr","Français 🇫🇷"] ].map(([l,lb])=>
            h("button",{className:"bs",onClick:()=>{state.lang=l;persist();render();},
              style:{padding:"10px",background:state.lang===l?"#ff0000":c.inp,color:state.lang===l?"#fff":c.sub,border:`1px solid ${state.lang===l?"#ff0000":c.border}`,borderRadius:12,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:12}},lb)
          )
        )
      ),
      // currency
      h("div",{style:{background:c.card2,border:`1px solid ${c.border}`,borderRadius:14,padding:14,marginBottom:12}},
        h("div",{style:{fontWeight:700,fontSize:13,marginBottom:10}},"💱 "+t.currency),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          ...[ ["dzd","🇩🇿 دينار"],["eur","🇪🇺 يورو"] ].map(([cur,lb])=>
            h("button",{className:"bs",onClick:()=>{state.cur=cur;persist();render();},
              style:{padding:"10px",background:state.cur===cur?"#ff6b35":c.inp,color:state.cur===cur?"#fff":c.sub,border:`1px solid ${state.cur===cur?"#ff6b35":c.border}`,borderRadius:12,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:13}},lb)
          )
        )
      ),
      // notif
      h("div",{style:{background:c.card2,border:`1px solid ${c.border}`,borderRadius:14,padding:14}},
        h("div",{style:{fontWeight:700,fontSize:13,marginBottom:8}},"🔔 "+t.enableNotif),
        state.notif
          ? h("div",{style:{color:c.green,fontWeight:700,fontSize:12}},t.notifOn)
          : h("button",{className:"bs",onClick:reqNotif,style:{width:"100%",padding:"11px",background:"rgba(251,191,36,0.1)",color:"#fbbf24",border:"1px solid rgba(251,191,36,0.3)",borderRadius:12,cursor:"pointer",fontFamily:"Cairo",fontWeight:700,fontSize:12}},
              "🔔 "+t.enableNotif)
      )
    ],()=>{state.setMod=false;render();});
  }

  // ── TOAST ──
  let toastEl=null;
  if(state.toast){
    toastEl=h("div",{style:{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:state.toast.type==="err"?"rgba(220,38,38,0.96)":"rgba(22,163,74,0.96)",borderRadius:14,padding:"12px 22px",color:"#fff",fontWeight:700,fontSize:13,backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",zIndex:600,whiteSpace:"nowrap",boxShadow:"0 8px 30px rgba(0,0,0,0.4)",animation:"toast-in 0.3s ease"}},state.toast.msg);
  }

  // ── ASSEMBLE ──
  const root=document.getElementById("root");
  const wrapper=h("div",{});
  wrapper.appendChild(header);
  wrapper.appendChild(tabs);
  wrapper.appendChild(content);
  wrapper.appendChild(nav);
  if(payModal)wrapper.appendChild(payModal);
  if(expModal)wrapper.appendChild(expModal);
  if(setModal)wrapper.appendChild(setModal);
  if(toastEl)wrapper.appendChild(toastEl);
  root.innerHTML="";
  root.appendChild(wrapper);
}

// ── INIT ──
render();
</script>
</body>
</html>
