<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROUKI مناوبة</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --P: #00ff88;
    --N: #00c8ff;
    --R: #8888aa;
    --gold: #ffd700;
    --accent: #ff3cac;
    --bg1: #020b14;
    --bg2: #050f1c;
    --glow-P: 0 0 20px #00ff8866;
    --glow-N: 0 0 20px #00c8ff66;
    --glow-R: 0 0 10px #8888aa33;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg1);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── ANIMATED BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 10% 20%, #003a5522 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 80%, #00234422 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 50% 50%, #ff3cac08 0%, transparent 60%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes bgPulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  /* grid lines overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 10;
    padding: 24px 20px 16px;
    background: linear-gradient(180deg, #020e18 0%, transparent 100%);
    text-align: center;
  }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00c8ff, #00ff88, #ff3cac, #ffd700);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradShift 4s linear infinite;
    text-shadow: none;
    filter: drop-shadow(0 0 20px #00c8ff88);
  }

  @keyframes gradShift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .header-sub {
    font-size: 13px;
    color: #00ff8877;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── TODAY TIKTOK CARD ── */
  .tiktok-card {
    position: relative;
    z-index: 10;
    margin: 16px auto;
    max-width: 420px;
    padding: 3px;
    border-radius: 22px;
    background: linear-gradient(135deg, #00c8ff, #ff3cac, #ffd700, #00ff88, #00c8ff);
    background-size: 300% 300%;
    animation: borderSpin 3s linear infinite;
    box-shadow: 0 0 40px #00c8ff44, 0 0 80px #ff3cac22;
  }

  @keyframes borderSpin {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .tiktok-inner {
    background: #060e18;
    border-radius: 20px;
    padding: 18px 22px;
    position: relative;
    overflow: hidden;
  }

  .tiktok-inner::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg, transparent 0deg, #00c8ff08 60deg, transparent 120deg);
    animation: scanRotate 6s linear infinite;
  }

  @keyframes scanRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .tiktok-date {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #ffd700;
    letter-spacing: 2px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .tiktok-label {
    font-size: 11px;
    color: #ffffff55;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }

  .tiktok-teams {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .tiktok-team {
    text-align: center;
    padding: 12px 6px;
    border-radius: 14px;
    background: #0d1e2e;
    border: 1px solid #ffffff11;
    transition: transform 0.3s;
    animation: teamPop 0.5s ease backwards;
  }

  .tiktok-team:nth-child(1) { animation-delay: 0.1s; }
  .tiktok-team:nth-child(2) { animation-delay: 0.2s; }
  .tiktok-team:nth-child(3) { animation-delay: 0.3s; }
  .tiktok-team:nth-child(4) { animation-delay: 0.4s; }

  @keyframes teamPop {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .tiktok-team:hover { transform: scale(1.08); }

  .team-letter {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: #ffffff66;
    margin-bottom: 6px;
  }

  .team-shift {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
  }

  .shift-P .team-shift { color: var(--P); text-shadow: var(--glow-P); }
  .shift-N .team-shift { color: var(--N); text-shadow: var(--glow-N); }
  .shift-R .team-shift { color: var(--R); text-shadow: var(--glow-R); }

  .shift-P { box-shadow: inset 0 0 15px #00ff8822, 0 0 8px #00ff8844; }
  .shift-N { box-shadow: inset 0 0 15px #00c8ff22, 0 0 8px #00c8ff44; }
  .shift-R { box-shadow: inset 0 0 10px #88888822; }

  .team-time {
    font-size: 9px;
    color: #ffffff33;
    margin-top: 4px;
  }

  /* ── LIVE CLOCK ── */
  .live-clock {
    position: relative;
    z-index: 10;
    text-align: center;
    margin: 6px 0 14px;
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    color: #00c8ff;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00c8ff88;
    animation: clockPulse 1s ease-in-out infinite alternate;
  }

  @keyframes clockPulse {
    from { opacity: 0.8; }
    to   { opacity: 1; }
  }

  /* ── CONTROLS ── */
  .controls {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 20px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 20px;
    border: 1px solid #00c8ff44;
    border-radius: 50px;
    background: #0a1e30;
    color: #00c8ff;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    backdrop-filter: blur(5px);
  }

  .btn:hover {
    background: #00c8ff;
    color: #020b14;
    box-shadow: 0 0 20px #00c8ff88;
    transform: translateY(-2px);
  }

  .btn.today-btn {
    background: linear-gradient(90deg, #ff3cac22, #ffd70022);
    border-color: #ffd70066;
    color: #ffd700;
  }

  .btn.today-btn:hover {
    background: linear-gradient(90deg, #ff3cac, #ffd700);
    color: #020b14;
    box-shadow: 0 0 20px #ffd70088;
  }

  /* ── MONTH DISPLAY ── */
  .month-display {
    position: relative;
    z-index: 10;
    text-align: center;
    margin: 8px 0 16px;
  }

  .month-name {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 700;
    color: white;
    letter-spacing: 3px;
  }

  .year-badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    background: linear-gradient(90deg, #ff3cac, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    margin-left: 10px;
  }

  /* ── DAY HEADERS ── */
  .day-headers {
    position: relative;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 14px 6px;
    max-width: 600px;
    margin: 0 auto;
  }

  .day-header {
    text-align: center;
    font-size: 10px;
    font-family: 'Orbitron', sans-serif;
    color: #ffffff33;
    letter-spacing: 1px;
    padding: 4px 0;
  }

  /* ── CALENDAR GRID ── */
  .calendar-wrap {
    position: relative;
    z-index: 10;
    max-width: 600px;
    margin: 0 auto;
    padding: 0 14px 14px;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day {
    aspect-ratio: 1;
    background: #0a1e30;
    border: 1px solid #ffffff0d;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    position: relative;
    overflow: hidden;
  }

  .day::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ffffff08, transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .day:hover::before { opacity: 1; }
  .day:hover {
    border-color: #00c8ff44;
    transform: scale(1.1) translateY(-2px);
    box-shadow: 0 8px 25px #00000066, 0 0 15px #00c8ff22;
    z-index: 5;
  }

  .day-num {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(11px, 2.5vw, 15px);
    font-weight: 700;
    color: white;
    line-height: 1;
  }

  .day-dots {
    display: flex;
    gap: 2px;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .dot-P { background: var(--P); box-shadow: 0 0 4px var(--P); }
  .dot-N { background: var(--N); box-shadow: 0 0 4px var(--N); }
  .dot-R { background: var(--R); }

  /* TODAY highlight */
  .day.is-today {
    background: linear-gradient(135deg, #002233, #001a28);
    border: 2px solid #ffd700;
    box-shadow:
      0 0 20px #ffd70066,
      0 0 40px #ffd70033,
      inset 0 0 20px #ffd70011;
    animation: todayPulse 2s ease-in-out infinite;
  }

  .day.is-today .day-num { color: #ffd700; text-shadow: 0 0 10px #ffd70088; }

  @keyframes todayPulse {
    0%, 100% { box-shadow: 0 0 20px #ffd70066, 0 0 40px #ffd70033, inset 0 0 20px #ffd70011; }
    50%       { box-shadow: 0 0 30px #ffd700aa, 0 0 60px #ffd70055, inset 0 0 30px #ffd70022; }
  }

  .today-star {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    animation: starSpin 2s linear infinite;
  }

  @keyframes starSpin {
    from { transform: translateX(-50%) rotate(0deg); }
    to   { transform: translateX(-50%) rotate(360deg); }
  }

  /* SELECTED */
  .day.selected {
    background: linear-gradient(135deg, #001e33, #002d4d);
    border-color: #00c8ff;
    box-shadow: 0 0 15px #00c8ff55;
  }

  /* ── DETAIL CARD ── */
  .detail-card {
    position: relative;
    z-index: 10;
    max-width: 420px;
    margin: 14px auto;
    padding: 20px;
    background: #060e18;
    border-radius: 20px;
    border: 1px solid #ffffff11;
    box-shadow: 0 10px 40px #00000055;
    font-size: 16px;
    text-align: center;
    color: #ffffff66;
  }

  .detail-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    color: #ffd700;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  .detail-teams-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
    margin-top: 10px;
  }

  .detail-team-box {
    background: #0d1e2e;
    border-radius: 14px;
    padding: 12px 6px;
    border: 1px solid #ffffff11;
    transition: transform 0.3s;
  }

  .detail-team-box:hover { transform: scale(1.05); }

  .dt-letter {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: #ffffff44;
    margin-bottom: 6px;
  }

  .dt-shift {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
  }

  .dt-P .dt-shift { color: var(--P); text-shadow: var(--glow-P); }
  .dt-N .dt-shift { color: var(--N); text-shadow: var(--glow-N); }
  .dt-R .dt-shift { color: var(--R); text-shadow: var(--glow-R); }

  .dt-P { box-shadow: inset 0 0 15px #00ff8822, 0 0 10px #00ff8833; }
  .dt-N { box-shadow: inset 0 0 15px #00c8ff22, 0 0 10px #00c8ff33; }

  .dt-time {
    font-size: 10px;
    color: #ffffff22;
    margin-top: 4px;
  }

  /* ── LEGEND ── */
  .legend {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 10px 20px;
    flex-wrap: wrap;
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #ffffff88;
    padding: 6px 14px;
    background: #0a1e30;
    border-radius: 50px;
    border: 1px solid #ffffff11;
  }

  .leg-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .leg-P { background: var(--P); box-shadow: 0 0 6px var(--P); }
  .leg-N { background: var(--N); box-shadow: 0 0 6px var(--N); }
  .leg-R { background: var(--R); }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: #ffffff22;
    letter-spacing: 2px;
    font-family: 'Orbitron', sans-serif;
  }

  /* ── ENTRANCE ANIMATIONS ── */
  .calendar-wrap { animation: fadeUp 0.5s ease backwards; }
  .tiktok-card   { animation: fadeUp 0.4s ease backwards; }

  @keyframes fadeUp {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* ── SCAN LINE ── */
  .scanline {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #00c8ff55, transparent);
    animation: scanDown 4s linear infinite;
    pointer-events: none;
    z-index: 999;
  }

  @keyframes scanDown {
    from { top: -3px; }
    to   { top: 100vh; }
  }
</style>
</head>
<body>

<div class="scanline"></div>

<header>
  <div class="header-title">⚡ ZEROUKI مناوبة ⚡</div>
  <div class="header-sub">Smart Shift Planner · 2026</div>
</header>

<div class="live-clock" id="clock">00:00:00</div>

<!-- TikTok TODAY card -->
<div class="tiktok-card" id="todayCard">
  <div class="tiktok-inner">
    <div class="tiktok-label">▶ اليوم الحالي — TODAY</div>
    <div class="tiktok-date" id="todayDateLabel"></div>
    <div class="tiktok-teams" id="todayTeams"></div>
  </div>
</div>

<div class="controls">
  <button class="btn" onclick="prevMonth()">◀ السابق</button>
  <button class="btn today-btn" onclick="today()">★ اليوم</button>
  <button class="btn" onclick="nextMonth()">التالي ▶</button>
</div>

<div class="month-display">
  <span class="month-name" id="monthName"></span>
  <span class="year-badge" id="yearBadge"></span>
</div>

<div class="day-headers">
  <div class="day-header">أحد</div>
  <div class="day-header">اثن</div>
  <div class="day-header">ثلاث</div>
  <div class="day-header">أرب</div>
  <div class="day-header">خمس</div>
  <div class="day-header">جمع</div>
  <div class="day-header">سبت</div>
</div>

<div class="calendar-wrap">
  <div class="calendar" id="calendar"></div>
</div>

<div class="detail-card" id="details">
  <span style="font-size:13px;letter-spacing:2px;font-family:Orbitron,sans-serif;color:#ffffff33;">
    ◈ اضغط على يوم لعرض تفاصيل الفواج ◈
  </span>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot leg-P"></div> P — نهار 07:00→17:00</div>
  <div class="leg-item"><div class="leg-dot leg-N"></div> N — ليل 17:00→07:00</div>
  <div class="leg-item"><div class="leg-dot leg-R"></div> R — راحة</div>
</div>

<footer>© ZEROUKI SHIFT PLANNER · 2026</footer>

<script>
const months = [
  "Janvier","Février","Mars","Avril","Mai","Juin",
  "Juillet","Août","Septembre","Octobre","Novembre","Décembre"
];

const monthsAr = [
  "جانفي","فيفري","مارس","أفريل","ماي","جوان",
  "جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
];

const cycle = ["P","P","N","N","R","R","R","R"];
const teams = { A:1, B:3, C:5, D:7 };

const EPOCH = new Date(2024, 0, 1); // reference date: 1 Jan 2024

let currentMonth = new Date().getMonth();
let currentYear  = new Date().getFullYear();
const todayDate  = new Date();

function daysSinceEpoch(year, month, day) {
  const d = new Date(year, month, day);
  return Math.floor((d - EPOCH) / 86400000);
}

function getShift(team, year, month, day) {
  const d = daysSinceEpoch(year, month, day);
  return cycle[(d + teams[team] + 2) % 8];
}

function shiftTime(s) {
  if (s === 'P') return '07:00→17:00';
  if (s === 'N') return '17:00→07:00';
  return '—';
}

// Live clock
function updateClock() {
  const n = new Date();
  const h = String(n.getHours()).padStart(2,'0');
  const m = String(n.getMinutes()).padStart(2,'0');
  const s = String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// TikTok today card
function renderTodayCard() {
  const t = new Date();
  const d = t.getDate(), mo = t.getMonth(), yr = t.getFullYear();
  document.getElementById('todayDateLabel').textContent =
    `${d} ${months[mo]} ${yr}`;
  const container = document.getElementById('todayTeams');
  container.innerHTML = '';
  ['A','B','C','D'].forEach(team => {
    const s = getShift(team, yr, mo, d);
    const div = document.createElement('div');
    div.className = `tiktok-team shift-${s}`;
    div.innerHTML = `
      <div class="team-letter">الفوج ${team}</div>
      <div class="team-shift">${s}</div>
      <div class="team-time">${shiftTime(s)}</div>
    `;
    container.appendChild(div);
  });
}

function generateCalendar() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  document.getElementById('monthName').textContent =
    months[currentMonth] + ' — ' + monthsAr[currentMonth];
  document.getElementById('yearBadge').textContent = currentYear;

  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0=Sun

  // empty cells before first day
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.style.aspectRatio = '1';
    cal.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const div = document.createElement('div');
    div.className = 'day';
    const isToday =
      d === todayDate.getDate() &&
      currentMonth === todayDate.getMonth() &&
      currentYear === todayDate.getFullYear();

    if (isToday) {
      div.classList.add('is-today');
      div.innerHTML = `<div class="today-star">★</div>`;
    }

    // dots for A B C D
    const shifts = ['A','B','C','D'].map(t => getShift(t, currentYear, currentMonth, d));
    const dotsHtml = shifts.map(s => `<div class="dot dot-${s}"></div>`).join('');

    div.innerHTML += `<div class="day-num">${d}</div><div class="day-dots">${dotsHtml}</div>`;

    div.addEventListener('click', () => {
      // remove old selected
      document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      showDetails(d);
    });

    // auto-click today
    if (isToday) {
      setTimeout(() => { div.click(); }, 300);
    }

    cal.appendChild(div);
  }
}

function showDetails(d) {
  const container = document.getElementById('details');
  const dayName = new Date(currentYear, currentMonth, d)
    .toLocaleDateString('ar-DZ', { weekday:'long' });

  let html = `<h3>★ ${d} ${months[currentMonth]} — ${dayName}</h3><div class="detail-teams-grid">`;

  ['A','B','C','D'].forEach(team => {
    const s = getShift(team, currentYear, currentMonth, d);
    html += `
      <div class="detail-team-box dt-${s}">
        <div class="dt-letter">الفوج ${team}</div>
        <div class="dt-shift">${s}</div>
        <div class="dt-time">${shiftTime(s)}</div>
      </div>`;
  });

  html += '</div>';
  container.innerHTML = html;
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  generateCalendar();
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  generateCalendar();
}

function today() {
  currentMonth = new Date().getMonth();
  currentYear  = new Date().getFullYear();
  generateCalendar();
}

// Auto-refresh at midnight to update "today"
function scheduleAutoRefresh() {
  const now = new Date();
  const msUntilMidnight =
    new Date(now.getFullYear(), now.getMonth(), now.getDate()+1) - now;
  setTimeout(() => {
    location.reload();
  }, msUntilMidnight);
}

renderTodayCard();
generateCalendar();
scheduleAutoRefresh();
</script>
